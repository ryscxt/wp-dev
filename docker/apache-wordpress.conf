# Konfiguracja Apache dla WordPressa za Traefikiem (Dokploy).

ServerName localhost
ServerTokens Prod
ServerSignature Off

DirectoryIndex index.php index.html

<Directory /var/www/html>
	Options -Indexes +FollowSymLinks
	AllowOverride All
	Require all granted
</Directory>

# Prawdziwy adres IP klienta zamiast adresu kontenera Traefika.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 127.0.0.1
RemoteIPTrustedProxy 10.0.0.0/8
RemoteIPTrustedProxy 172.16.0.0/12
RemoteIPTrustedProxy 192.168.0.0/16

# Pliki, które nie powinny być serwowane publicznie.
<FilesMatch "^(wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt|\.env.*|.*\.(sql|log|bak|swp|dist|ini))$">
	Require all denied
</FilesMatch>

<FilesMatch "^\.">
	Require all denied
</FilesMatch>

# Brak wykonywania PHP w katalogu wgranych plików.
<Directory /var/www/html/wp-content/uploads>
	<FilesMatch "\.(?i:ph(?:p[0-9]?|tml|ar)|s?html?)$">
		Require all denied
	</FilesMatch>
</Directory>

# Katalog roboczy aktualizacji nie jest treścią publiczną.
<DirectoryMatch "/var/www/html/wp-content/(upgrade|upgrade-temp-backup)">
	Require all denied
</DirectoryMatch>
