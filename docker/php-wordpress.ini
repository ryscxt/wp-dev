; Ustawienia PHP dla WordPressa w kontenerze.

memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

file_uploads = On
upload_max_filesize = 128M
post_max_size = 128M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

; OPcache - ustawienia produkcyjne rekomendowane dla WordPressa.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
